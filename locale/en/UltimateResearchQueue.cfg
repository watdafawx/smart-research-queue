urq-welcome=[font=default-bold]Smart Research Queue[/font]\n\nClick a technology to view its information in this panel. Double-click it to queue it (prerequisites included), Shift + double-click to put it at the front. To reorder the queue, Ctrl + click a queued technology and click where it should go, or drag in the game's own queue (graph button): the first 7 entries are mirrored there.\n\nWhen the queue has nothing the labs can work on, auto research (panel on the right) picks the next technology: your goals first, then by strategy, using only the science packs you allow. Add goals and blacklist technologies with the buttons under a technology's details.\n\nOnce you are used to the mod, you can disable the control hints in the per-player mod settings.
srq-toggle-auto=Show / hide auto research
